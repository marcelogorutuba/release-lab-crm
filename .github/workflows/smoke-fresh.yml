name: Smoke - fresh DB

# No paths filter: a boot can break from anywhere (config/, Gemfile, an
# initializer), and a required check that never runs blocks the merge forever.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SMOKE_IMAGE: evo-crm-smoke:ci
  COMPOSE: docker compose -f docker-compose.smoke-fresh.yml

jobs:
  smoke-fresh:
    name: boot on an empty database -> /health/ready
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # Same Dockerfile and build args as the publisher, so what boots here is
      # this commit, not an image already published.
      - name: Build the image of this commit
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
            RAILS_SERVE_STATIC_FILES=true
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max

      - name: Boot and wait for /health/ready
        run: |
          $COMPOSE up -d
          for i in $(seq 1 60); do
            cid=$($COMPOSE ps -aq crm)
            state=$(docker inspect --format='{{.State.Status}}' "$cid" 2>/dev/null || echo starting)
            body=$(curl -s http://127.0.0.1:13000/health/ready || true)
            echo "[$i/60] state=$state ready=${body:-none}"
            if echo "$body" | grep -q '"ready":true'; then exit 0; fi
            if [ "$state" = exited ] || [ "$state" = dead ]; then
              echo "::error::the CRM container exited before it was ready"
              $COMPOSE logs crm 2>&1 | tail -60
              exit 1
            fi
            sleep 5
          done
          echo "::error::the CRM did not report ready in 300s"
          $COMPOSE logs crm 2>&1 | tail -60
          exit 1

      - name: Capture logs
        if: always()
        run: |
          mkdir -p /tmp/logs
          $COMPOSE logs crm > /tmp/logs/crm.log 2>&1 || true
          $COMPOSE logs postgres > /tmp/logs/postgres.log 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-fresh-logs
          path: /tmp/logs/
          retention-days: 7

      - name: Teardown
        if: always()
        run: $COMPOSE down -v
